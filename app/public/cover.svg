<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 427" width="1200" height="427">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="427" fill="url(#bg)" />
  <circle cx="100" cy="80" r="60" fill="rgba(96,165,250,0.08)" />
  <circle cx="1100" cy="350" r="80" fill="rgba(96,165,250,0.06)" />
  <circle cx="900" cy="50" r="40" fill="rgba(59,130,246,0.1)" />
  <circle cx="200" cy="380" r="50" fill="rgba(30,64,175,0.15)" />
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="427" stroke="white" stroke-width="1" />
    <line x1="200" y1="0" x2="1400" y2="427" stroke="white" stroke-width="1" />
    <line x1="400" y1="0" x2="1600" y2="427" stroke="white" stroke-width="1" />
    <line x1="600" y1="0" x2="1800" y2="427" stroke="white" stroke-width="1" />
    <line x1="800" y1="0" x2="2000" y2="427" stroke="white" stroke-width="1" />
    <line x1="1000" y1="0" x2="2200" y2="427" stroke="white" stroke-width="1" />
  </g>
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="rgba(255,255,255,0.1)" />
    <g transform="translate(35, 35)">
      <path d="M-14,12 L0,-16 L14,12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-7" y1="0" x2="7" y2="0" stroke="white" stroke-width="3" stroke-linecap="round" />
      <circle cx="-14" cy="12" r="2.5" fill="#60a5fa" />
      <circle cx="14" cy="12" r="2.5" fill="#60a5fa" />
      <circle cx="0" cy="-16" r="2.5" fill="#60a5fa" />
    </g>
    <text x="85" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="2">Dev.AGSmart</text>
    <text x="85" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="6">TECNOLOGÍA &amp; AUTOMATIZACIÓN</text>
  </g>
  <g transform="translate(700, 120)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Automatiza tu negocio</text>
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="url(#accent)">con Inteligencia Artificial</text>
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#60a5fa" />
      <text x="20" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">WhatsApp &amp; Instagram</text>
      <rect x="0" y="30" width="12" height="12" rx="3" fill="#60a5fa" />
      <text x="20" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">CRM integrado</text>
      <rect x="200" y="0" width="12" height="12" rx="3" fill="#60a5fa" />
      <text x="220" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">Asistentes IA</text>
      <rect x="200" y="30" width="12" height="12" rx="3" fill="#60a5fa" />
      <text x="220" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">Páginas web &amp; Apps</text>
    </g>
  </g>
  <rect x="0" y="420" width="1200" height="7" fill="url(#accent)" />
  <circle cx="650" cy="200" r="3" fill="#93c5fd">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="720" cy="180" r="2" fill="#60a5fa">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="230" r="2.5" fill="#bfdbfe">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
