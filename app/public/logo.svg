<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background gradient with depth -->
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="4" />
      <feGaussianBlur stdDeviation="4" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.3" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
    
    <!-- Drop shadow for icon -->
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring with depth -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="2" />
  
  <!-- Main background with inner shadow -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" filter="url(#innerShadow)" />
  
  <!-- Highlight arc (top-left shine) -->
  <path d="M 40,60 A 75,75 0 0,1 160,60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Main icon group with shadow -->
  <g filter="url(#iconShadow)">
    <!-- Chat bubble with 3D effect -->
    <g transform="translate(100, 82)">
      <!-- Bubble shadow -->
      <path d="M-32,-28 Q-32,-45 0,-45 Q32,-45 32,-28 L32,8 Q32,23 16,23 L6,23 L0,35 L-6,23 L-16,23 Q-32,23 -32,8 Z" 
            fill="rgba(0,0,0,0.2)" transform="translate(2,3)" />
      <!-- Bubble main -->
      <path d="M-32,-28 Q-32,-45 0,-45 Q32,-45 32,-28 L32,8 Q32,23 16,23 L6,23 L0,35 L-6,23 L-16,23 Q-32,23 -32,8 Z" 
            fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Bubble highlight -->
      <path d="M-28,-30 Q-28,-42 -5,-42" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Letter A with depth -->
      <path d="M-13,12 L0,-18 L13,12" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
      <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="white" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- AI sparkle dots with glow -->
      <circle cx="22" cy="-32" r="3.5" fill="#93c5fd" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="-24" cy="-30" r="2.5" fill="#60a5fa" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="16" cy="16" r="3" fill="#bfdbfe" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
  
  <!-- Decorative circuit lines -->
  <g stroke="rgba(96,165,250,0.4)" stroke-width="1" fill="none">
    <line x1="20" y1="100" x2="40" y2="100" />
    <circle cx="20" cy="100" r="2" fill="#60a5fa" />
    <line x1="160" y1="100" x2="180" y2="100" />
    <circle cx="180" cy="100" r="2" fill="#60a5fa" />
    <line x1="100" y1="15" x2="100" y2="30" />
    <circle cx="100" cy="15" r="2" fill="#60a5fa" />
  </g>
  
  <!-- Company name with depth -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#textGrad)" letter-spacing="4" filter="url(#glow)">AGSmart</text>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="6">DEV</text>
  
  <!-- Bottom accent -->
  <rect x="60" y="192" width="80" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8" />
</svg>
